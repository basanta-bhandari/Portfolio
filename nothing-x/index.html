<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nothing X · Interactive demo</title>
<link rel="canonical" href="https://basanta.cc/nothing-x/">
<meta name="description" content="Try Nothing X audio controls in your browser. Explore Nothing and CMF devices, themes, sound settings and desktop audio with simulated data.">
<style>
:root{--background:#0c0c0c;--panel:#171717;--card:#242424;--border:#363636;--text:#f0efed;--muted:#9d9d9a;--accent:#ff343b;--ink:#090909;font:15px system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text)}button,select,input{font:inherit}button,select{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:28px;padding:12px 20px;cursor:pointer}button:hover,select:focus{border-color:var(--accent)}button.active{background:var(--accent);color:var(--ink);border-color:var(--accent)}a{color:var(--accent);text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:var(--panel);padding:32px 18px;border-right:1px solid var(--border);display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh}canvas{width:174px;height:28px;margin-bottom:35px}nav{display:grid;gap:10px}nav button{text-align:left;border-color:transparent;background:transparent}nav button.active{background:var(--card);color:var(--accent)}aside footer{margin-top:auto;display:grid;gap:15px}main{padding:30px;max-width:1500px;width:100%;margin:auto}header,.row{display:flex;align-items:center;gap:16px;justify-content:space-between}h1{font-size:32px;font-weight:600;margin:0 0 24px}h2{font-size:19px;font-weight:500;margin:0 0 24px}p{line-height:1.6}.muted{color:var(--muted)}.notice{font-size:12px;color:var(--muted);margin-bottom:20px}.card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:24px;margin:16px 0}.hero{display:flex;align-items:center;justify-content:space-between;min-height:225px}.brand{font:11px monospace;color:var(--accent);letter-spacing:1px}.hero h2{font-size:32px;font-weight:650;margin:20px 0}.art{display:flex;align-items:center;justify-content:center;gap:12px;width:45%}.art img{max-width:27%;max-height:160px;object-fit:contain}.art img:last-child{max-width:42%}.batteries{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.battery{margin:0}.battery .row{margin:15px 0}.battery img{width:48px;height:58px;object-fit:contain}.ring{display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--value)*1%),var(--border) 0);border-radius:50%;width:74px;height:74px}.ring span{display:grid;place-items:center;background:var(--card);border-radius:50%;width:64px;height:64px}.segments{display:flex;gap:12px}.segments button{flex:1}.control{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0}.control label{flex:1}.control input[type=checkbox]{appearance:none;width:42px;height:24px;border-radius:20px;background:var(--border);position:relative;cursor:pointer;flex-shrink:0}.control input[type=checkbox]:after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:var(--muted);transition:left .12s}.control input:checked{background:var(--accent)}.control input:checked:after{left:21px;background:var(--ink)}input[type=range]{accent-color:var(--accent);width:100%;margin:16px 0}.wide{width:100%}.hint{font-size:12px;color:var(--muted)}select{max-width:100%}.section{display:none}.section.active{display:block}#feedback{min-height:24px;font-size:12px;color:var(--muted);margin-top:24px}.model{margin-bottom:24px;display:flex;gap:12px;align-items:center}.model select{min-width:220px}code{font-family:monospace}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{height:auto;position:static;padding:20px}canvas{margin:0}nav{display:flex;flex-wrap:wrap}aside footer{display:flex;margin-top:10px;align-items:center}main{padding:18px}h1{font-size:27px}.batteries{gap:8px}.card{padding:18px;border-radius:22px}.hero h2{font-size:24px}.hero{min-height:190px}.art{width:42%;gap:5px}.art img{max-height:110px}.segments{gap:6px}.segments button{padding:11px;font-size:13px}.battery .row{flex-direction:column;gap:10px}.model{flex-wrap:wrap}}
</style>
<div class="shell">
<aside>
<canvas id="brand" width="348" height="56" aria-label="Nothing X"></canvas>
<nav aria-label="Settings pages">
<button class="active" data-page="overview">◉ &nbsp; Overview</button>
<button data-page="sound">≋ &nbsp; Sound</button>
<button data-page="audio">♫ &nbsp; Audio</button>
<button data-page="device">⌘ &nbsp; Device</button>
</nav>
<footer><label for="theme" class="brand">THEME</label><select id="theme" aria-label="Colour theme"></select><span class="hint">◉ &nbsp; Demo mode</span><a href="https://github.com/basanta-bhandari/Nothing-x/releases/latest">Download Nothing X ↗</a></footer>
</aside>
<main>
<header><h1 id="title">Overview</h1><button id="refresh">↻ &nbsp; Refresh</button></header>
<div class="notice">INTERACTIVE PREVIEW · Simulated settings. Bluetooth and system audio stay on your device.</div>
<div class="model"><label for="model" class="muted">Device</label><select id="model"><option value="B172">CMF Buds Pro 2</option><option value="B170">Nothing Headphone (1)</option><option value="B155">Nothing Ear (2)</option></select></div>
<div id="content"></div><div id="feedback" role="status" aria-live="polite"></div>
</main></div>
<script type="module">
const $=s=>document.querySelector(s), assets='assets/';
const [registry,catalog]=await Promise.all(['themes/themes.json','models.json'].map(async p=>{const response=await fetch(assets+p);if(!response.ok)throw new Error('Could not load demo data');return response.json()}));
let model=catalog.models.find(m=>m.id==='B172'), page='overview', anc='Adaptive', volume=62;
const state={spatial:false,low_latency:false,in_ear:true,dual:true,bass:true,mute:false};
const glyphs={N:['10001','11001','11001','10101','10011','10011','10001'],O:['01110','10001','10001','10001','10001','10001','01110'],T:['11111','00100','00100','00100','00100','00100','00100'],H:['10001','10001','10001','11111','10001','10001','10001'],I:['11111','00100','00100','00100','00100','00100','11111'],G:['01110','10001','10000','10111','10001','10001','01110'],X:['10001','10001','01010','00100','01010','10001','10001']};
function brand(){const c=$('#brand').getContext('2d');c.clearRect(0,0,348,56);c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text');[...'NOTHING X'].forEach((ch,k)=>(glyphs[ch]||[]).forEach((line,y)=>[...line].forEach((v,x)=>{if(v==='1'){c.beginPath();c.arc(5+k*36+x*6,7+y*6,1.8,0,Math.PI*2);c.fill()}})))}
for(const t of registry.themes){const o=document.createElement('option');o.value=t.id;o.textContent=t.name;$('#theme').append(o)}
function saveTheme(id){try{localStorage.setItem('nothingx-demo-theme',id)}catch{}}
function savedTheme(){try{return localStorage.getItem('nothingx-demo-theme')||'nothing'}catch{return 'nothing'}}
function theme(id){const t=registry.themes.find(t=>t.id===id)||registry.themes[0];for(const key of ['background','panel','card','border','text','muted','accent','ink'])document.documentElement.style.setProperty('--'+key,t[key]);document.documentElement.style.colorScheme=id==='porcelain'?'light':'dark';$('#theme').value=t.id;saveTheme(t.id);brand()}
$('#theme').onchange=e=>theme(e.target.value);theme(savedTheme());
const image=part=>assets+(model.artwork==='cmf-buds-pro-2'?`cmf-buds-pro-2/blue_${part}.png`:`devices/${model.artwork}_${part}.png`);
const single=()=>['headphones','neckband'].includes(model.kind);
const card=(title,body)=>`<div class="card"><h2>${title}</h2>${body}</div>`;
const toggle=(key,title)=>`<div class="control"><label for="${key}">${title}</label><input type="checkbox" id="${key}" data-toggle="${key}" ${state[key]?'checked':''}></div>`;
const choices=(key,values,chosen)=>`<div class="segments">${values.map(v=>`<button data-choice="${key}" data-value="${v}" class="${v===chosen?'active':''}">${v}</button>`).join('')}</div>`;
function noise(){return model.features.includes('anc')?card('Noise control',choices('anc',['Noise cancellation','Transparency','Off'],['Off','Transparency'].includes(anc)?anc:'Noise cancellation')+`<div class="control"><label for="strength" class="muted">Cancellation strength</label><select id="strength">${model.anc_modes.filter(v=>!['Off','Transparency'].includes(v)).map(v=>`<option ${anc===v?'selected':''}>${v}</option>`).join('')}</select></div>`):''}
function overview(){const parts=single()?['headphone']:['left','right','case'],levels=single()?[84]:[92,88,76];return `<div class="card hero"><div><span class="brand">${model.name.startsWith('CMF')?'CMF BY NOTHING':'NOTHING AUDIO'}</span><h2>${model.name}</h2><p class="muted">Demo mode</p></div><div class="art">${parts.map(p=>`<img alt="${p}" src="${image(p)}">`).join('')}</div></div><div class="batteries" style="grid-template-columns:repeat(${parts.length},1fr)">${parts.map((p,i)=>`<div class="card battery"><div class="muted">${{left:'Left earbud',right:'Right earbud',case:'Charging case',headphone:'Headphones'}[p]}</div><div class="row"><img alt="" src="${image(p)}"><div class="ring" style="--value:${levels[i]}"><span>${levels[i]}%</span></div></div><small class="muted">Battery level</small></div>`).join('')}</div>${noise()}`}
function sound(){return card('Equalizer',`<select class="wide" aria-label="Equalizer preset" data-feedback="Equalizer">${model.eq_presets.map(p=>`<option>${p.name}</option>`).join('')}</select>`)+(model.features.includes('bass')?card('Ultra Bass',toggle('bass','Enable Ultra Bass')+`<label class="muted" for="basslevel">Level <output id="bassvalue">3</output> / ${model.bass_max}</label><input id="basslevel" type="range" min="0" max="${model.bass_max}" step=".5" value="3">`):'')+card('Audio settings',[['spatial','Spatial audio'],['low_latency','Low latency mode']].filter(([k])=>model.features.includes(k)).map(([k,t])=>toggle(k,t)).join(''))}
function audio(){return card('Bluetooth audio',`<select class="wide" aria-label="Bluetooth profile" data-feedback="Bluetooth profile"><option>High Fidelity Playback (A2DP Sink, codec AAC)</option><option>High Fidelity Playback (A2DP Sink, codec SBC)</option><option>High Fidelity Playback (A2DP Sink, codec SBC-XQ)</option><option>Headset Head Unit (HSP/HFP, codec mSBC)</option></select><p class="muted">AAC · s16le 2ch 48000 Hz</p><p class="hint">Available codecs depend on the device and operating system.</p>`)+card('Device output',`<label for="volume">Volume <output id="volvalue">${volume}%</output></label><input id="volume" type="range" min="0" max="100" value="${volume}"><label for="balance">Balance <output id="balvalue">Center</output></label><input id="balance" type="range" min="-100" max="100" value="0">${toggle('mute','Mute')}`)+card('Applications',`<label for="music">Music player</label><input id="music" type="range" min="0" max="100" value="80"><p class="hint">The Linux app includes application volume, mute and output routing through PipeWire.</p>`)}
function device(){return card('Device settings',[['in_ear','In-ear detection'],['dual','Dual connection']].filter(([k])=>model.features.includes(k)).map(([k,t])=>toggle(k,t)).join('')+(model.features.includes('codec')?`<div class="control"><label for="codec">High-resolution audio</label><select id="codec" data-feedback="Audio codec"><option>Standard · AAC / SBC</option><option>LDAC</option></select></div>`:''))+card('Connection & device',`<p class="muted">Model ${model.id} · Simulated firmware</p><p>The desktop app adds device connection, startup settings and updates matched to your installed version.</p><a href="https://github.com/basanta-bhandari/Nothing-x">Source & setup ↗</a>`)}
function feedback(message){$('#feedback').textContent=message+' · preview only'}
function render(){$('#content').innerHTML=({overview,sound,audio,device})[page]();document.querySelectorAll('[data-toggle]').forEach(el=>el.onchange=()=>{state[el.dataset.toggle]=el.checked;feedback(el.labels[0].textContent+(el.checked?' enabled':' disabled'))});document.querySelectorAll('[data-choice]').forEach(el=>el.onclick=()=>{anc=el.dataset.value==='Noise cancellation'?model.anc_modes.find(v=>!['Off','Transparency'].includes(v)):el.dataset.value;render();feedback('Noise control: '+anc)});if($('#strength'))$('#strength').onchange=e=>{anc=e.target.value;feedback('Noise control: '+anc)};document.querySelectorAll('[data-feedback]').forEach(el=>el.onchange=()=>feedback(el.dataset.feedback+': '+el.value));if($('#volume'))$('#volume').oninput=e=>{volume=+e.target.value;$('#volvalue').value=volume+'%'};if($('#balance'))$('#balance').oninput=e=>$('#balvalue').value=e.target.value==0?'Center':e.target.value<0?Math.abs(e.target.value)+'% left':e.target.value+'% right';if($('#basslevel'))$('#basslevel').oninput=e=>$('#bassvalue').value=e.target.value}
for(const button of document.querySelectorAll('[data-page]'))button.onclick=()=>{page=button.dataset.page;$('#title').textContent=page[0].toUpperCase()+page.slice(1);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b===button));$('#feedback').textContent='';render()};
$('#model').onchange=e=>{model=catalog.models.find(m=>m.id===e.target.value);anc=model.anc_modes.includes('Adaptive')?'Adaptive':'High';render()};$('#refresh').onclick=()=>{render();feedback('Simulated device refreshed')};render();
</script>
</html>
