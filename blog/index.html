<html>
<head>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="grid-background"></div>

    <nav class="topnav">
        <a href="../index.html" class="brand">Home?<span class="dot">.</span></a>
        <div class="links">
            <a href="../index.html">Home</a>
            <a href="../projects/ ">Projects</a>
            <a href="index.html" class="current">Blog</a>
            <a href="https://github.com/basanta-bhandari" target="_blank">GitHub</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>Blog</h1>
        <p>Notes, updates, and whatever I'm building this week.</p>
    </header>

    <div class="blog-shell">
        <div class="blog-terminal" id="fallbackTerminal">
            <div class="term-bar">
                <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
                <span class="term-path">~/blog/first-post.md</span>
            </div>
            <div class="term-body">
                <span class="prompt">$</span> <span class="out">cat first-post.md</span><br><br>
                <span class="out" id="blogTypedLine">Hello World!<span class="type-cursor"></span></span>
            </div>
        </div>

        <div id="postsList" class="posts-list"></div>
        <p class="blog-note" id="blogNote">First real post is coming soon &mdash; check back later.</p>
    </div>

    <footer>
        <p>BASANTA BHANDARI &bull; PORTFOLIO &bull; 2026</p>
        <p style="margin-top:8px;">
            <a href="https://github.com/basanta-bhandari" target="_blank">GitHub</a>
        </p>
    </footer>

    <script src="script.js"></script>
    <script>
    async function loadPosts() {
        try {
            const res = await fetch('/api/posts');
            if (!res.ok) return; // leave the fallback terminal showing
            const posts = await res.json();
            if (!posts.length) return;

            document.getElementById('fallbackTerminal').style.display = 'none';
            document.getElementById('blogNote').style.display = 'none';

            const list = document.getElementById('postsList');
            posts.forEach(p => {
                const card = document.createElement('a');
                card.href = 'post.html?slug=' + encodeURIComponent(p.slug);
                card.className = 'post-card';
                const date = new Date(p.published_at).toLocaleDateString();
                card.innerHTML =
                    '<h3>' + p.title + '</h3>' +
                    '<p class="post-card-date">' + date + '</p>' +
                    (p.excerpt ? '<p>' + p.excerpt + '</p>' : '');
                list.appendChild(card);
            });
        } catch {
            // API/DB not set up yet (e.g. local static preview) - fallback stays visible
        }
    }
    loadPosts();
    </script>
</body>
</html>
