<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post</title>
<link rel="stylesheet" href="styles.css">
<style>
  .post-wrap { max-width: 900px; margin: 0 auto; padding: 40px; position: relative; z-index: 2; }
  .post-wrap h1 { font-family: Arial, Helvetica, sans-serif; margin-bottom: 8px; font-size: clamp(1.8rem, 5vw, 2.6rem); }
  .post-date { color: var(--muted); font-size: .8em; margin-bottom: 24px; letter-spacing: .5px; }
  .post-content { line-height: 1.8; font-size: .95rem; }
  .post-content p { margin-bottom: 16px; }
  .post-content h1, .post-content h2, .post-content h3 { font-family: Arial, Helvetica, sans-serif; margin: 28px 0 12px; }
  .post-content img { max-width: 100%; border-radius: 10px; margin: 16px 0; border: 1px solid var(--hair); }
  .post-content a { text-decoration: underline; font-weight: bold; }
</style>
</head>
<body>
<div class="grid-background"></div>
<nav class="topnav">
    <a href="../index.html" class="brand">Home?<span class="dot">.</span></a>
    <div class="links">
        <a href="../index.html">Home</a>
        <a href="../projects/ ">Projects</a>
        <a href="index.html" class="current">Blog</a>
        <a href="https://github.com/basanta-bhandari" target="_blank">GitHub</a>
    </div>
</nav>
<div class="post-wrap">
    <h1 id="postTitle">Loading...</h1>
    <div class="post-date" id="postDate"></div>
    <div class="post-content" id="postContent"></div>
</div>
<footer>
    <p>BASANTA BHANDARI &bull; PORTFOLIO &bull; 2026</p>
</footer>
<script>
const slug = new URLSearchParams(window.location.search).get('slug');

// Tiny markdown renderer - supports headings, bold, italic, links, images,
// and paragraphs. Everything is HTML-escaped first, so user content can
// never inject raw tags - only the specific patterns below become HTML.
function renderMarkdown(md) {
    const escape = (s) => s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

    let html = escape(md);

    html = html.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
        '<img src="$2" alt="$1">');
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');

    html = html.split(/\n\n+/).map(block => {
        const trimmed = block.trim();
        if (/^<h[1-3]>/.test(trimmed) || /^<img/.test(trimmed)) return trimmed;
        return '<p>' + trimmed.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');

    return html;
}

async function load() {
    if (!slug) {
        document.getElementById('postTitle').textContent = 'Post not found';
        return;
    }
    const res = await fetch('/api/posts/' + encodeURIComponent(slug));
    if (!res.ok) {
        document.getElementById('postTitle').textContent = 'Post not found';
        return;
    }
    const post = await res.json();
    document.getElementById('postTitle').textContent = post.title;
    document.getElementById('postDate').textContent = new Date(post.published_at).toLocaleDateString();
    document.getElementById('postContent').innerHTML = renderMarkdown(post.content);
}
load();
</script>
</body>
</html>
