<html>
<head>
    <script src="/theme.js?v=2"></script>
    <link rel="stylesheet" href="/blog/styles.css">
    <link rel="stylesheet" href="/theme-toggle.css?v=2">
</head>
<body>
    <div class="grid-background"></div>

    <nav class="topnav">
        <a href="../index.html" class="brand">Home?<span class="dot">.</span></a>
        <div class="links">
            <a href="../index.html">Home</a>
            <a href="../projects/">Projects</a>
            <a href="index.html" class="current">Blog</a>
            <a href="https://github.com/basanta-bhandari" target="_blank">GitHub</a>
            <button type="button" class="theme-toggle" data-theme-toggle><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
        </div>
    </nav>

    <header class="page-header">
        <h1>Blog</h1>
        <p>Notes, updates, and whatever I'm building this week.</p>
    </header>

    <div class="blog-shell">
        <label class="search-label" for="blogSearch">Search posts</label>
        <input id="blogSearch" class="search-input" type="search" placeholder="Title, excerpt, or slug" autocomplete="off">
        <p id="searchEmpty" class="search-empty" hidden>No posts match that search.</p>
        <div id="postsList" class="posts-list"></div>
        <p class="blog-note" id="blogNote">First real post is coming soon - check back later.</p>
    </div>

    <footer>
        <p>BASANTA BHANDARI - PORTFOLIO - 2026</p>
        <p style="margin-top:8px;">
            <a href="https://github.com/basanta-bhandari" target="_blank">GitHub</a>
        </p>
    </footer>

    <script>
    async function loadPosts() {
        try {
            const res = await fetch('/api/posts');
            if (!res.ok) return; // leave the fallback terminal showing
            const posts = await res.json();
            if (!posts.length) return;

            document.getElementById('blogNote').style.display = 'none';

            const list = document.getElementById('postsList');
            const search = document.getElementById('blogSearch');
            const empty = document.getElementById('searchEmpty');
            const fuzzyMatch = (query, value) => {
                const words = value.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
                return query.toLowerCase().trim().split(/\s+/).every(term =>
                    words.some(word => {
                        let at = 0;
                        for (const character of term) { at = word.indexOf(character, at); if (at === -1) return false; at++; }
                        return true;
                    })
                );
            };
            const filter = () => {
                const query = search.value.trim(); let visible = 0;
                list.querySelectorAll('.post-card').forEach(card => {
                    const matches = !query || fuzzyMatch(query, card.dataset.search);
                    card.hidden = !matches;
                    if (matches) visible++;
                });
                empty.hidden = visible !== 0;
            };

            posts.forEach(p => {
                const card = document.createElement('a');
                card.href = '/blog/post.html?slug=' + encodeURIComponent(p.slug);
                card.className = 'post-card';
                card.dataset.search = [p.title, p.excerpt || '', p.slug].join(' ');
                const bar = document.createElement('div');
                bar.className = 'post-card-bar';
                for (let i = 0; i < 3; i++) {
                    const dot = document.createElement('span');
                    dot.className = 'term-dot';
                    bar.appendChild(dot);
                }
                const path = document.createElement('span');
                path.className = 'term-path';
                path.textContent = '~/blog/' + p.slug + '.md';
                bar.appendChild(path);

                const body = document.createElement('div');
                body.className = 'post-card-body';
                const title = document.createElement('h3');
                title.textContent = p.title;
                const date = document.createElement('p');
                date.className = 'post-card-date';
                date.textContent = new Date(p.published_at).toLocaleDateString();
                body.append(title, date);
                if (p.excerpt) {
                    const excerpt = document.createElement('p');
                    excerpt.textContent = p.excerpt;
                    body.appendChild(excerpt);
                }
                card.append(bar, body);
                list.appendChild(card);
            });
            search.addEventListener('input', filter);
        } catch {
            // API/DB not set up yet (e.g. local static preview) - fallback stays visible
        }
    }
    loadPosts();
    </script>
</body>
</html>
