<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="/theme.js?v=2"></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="/theme-toggle.css?v=2">
<style>
.post-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px;
    position: relative;
    z-index: 2;
}

.post-terminal {
    border: 2px solid var(--line);
    border-radius: calc(var(--radius) + 2px);
    overflow: hidden;
    background: #080808;
    color: #eaeaea;
    box-shadow: 0 14px 30px rgba(0,0,0,.13);
}

.post-terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,.18);
}

.post-terminal-bar .term-dot { display: inline-block; }

.post-terminal-content { padding: 28px 30px 34px; }

.post-wrap h1 {
    font-family: Arial, Helvetica, sans-serif;
    margin-bottom: 8px;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
}

.post-date {
    color: #b8b8b8;
    font-size: .8em;
    margin-bottom: 24px;
    letter-spacing: .5px;
}

.post-content {
    line-height: 1.8;
    font-size: .95rem;
}

.post-content p { margin-bottom: 16px; }

.post-content h1,
.post-content h2,
.post-content h3 {
    font-family: Arial, Helvetica, sans-serif;
    margin: 28px 0 12px;
}

.post-content img {
    max-width: 100%;
    border-radius: 10px;
    margin: 16px 0;
    border: 1px solid var(--hair);
}

.post-content a {
    text-decoration: underline;
    font-weight: bold;
}

.post-terminal .term-path { margin-left: 10px; color: #b8b8b8; }

@media (max-width: 620px) {
    .post-wrap { padding: 28px 18px 42px; }
}

@media (max-width: 560px) {
    .post-wrap { padding: 20px 12px 34px; }
    .post-terminal { border-width: 1px; border-radius: 20px; }
    .post-terminal-bar { padding: 10px 13px; }
    .post-terminal-content { padding: 22px 18px 26px; }
    .post-terminal .term-path {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .post-wrap h1 { font-size: clamp(1.7rem, 10vw, 2.2rem); }
    .post-date { margin-bottom: 18px; }
    .post-content { font-size: .9rem; line-height: 1.72; }
    .post-content h1,
    .post-content h2,
    .post-content h3 { margin-top: 24px; }
}

</style>
</head>
<body>
<div class="grid-background"></div>
<nav class="topnav">
    <a href="../index.html" class="brand">Home?<span class="dot">.</span></a>
    <div class="links">
        <a href="../index.html">Home</a>
        <a href="../projects/">Projects</a>
        <a href="index.html" class="current">Blog</a>
        <a href="https://github.com/basanta-bhandari" target="_blank">GitHub</a>
        <button type="button" class="theme-toggle" data-theme-toggle><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
    </div>
</nav>
<div class="post-wrap">
    <div class="post-terminal">
        <div class="post-terminal-bar">
            <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
            <span class="term-path" id="postPath">~/blog/post.md</span>
        </div>
        <div class="post-terminal-content">
            <h1 id="postTitle">Loading...</h1>
            <div class="post-date" id="postDate"></div>
            <div class="post-content" id="postContent"></div>
        </div>
    </div>
</div>
<footer>
    <p>BASANTA BHANDARI - PORTFOLIO - 2026</p>
</footer>
<script>
const slug = new URLSearchParams(window.location.search).get('slug');

// Tiny markdown renderer - supports headings, bold, italic, links, images,
// and paragraphs. Everything is HTML-escaped first, so user content can
// never inject raw tags - only the specific patterns below become HTML.
function renderMarkdown(md) {
    const escape = (s) => s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

    let html = escape(md);

    html = html.replace(/!\[([^\]]*)\]\(((?:https?:\/\/|data:image\/(?:png|jpeg|gif|webp|avif);base64,)[^\s)]+)\)/gi,
        '<img src="$2" alt="$1">');
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
    html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
    html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');

    html = html.split(/\n\n+/).map(block => {
        const trimmed = block.trim();
        if (/^<h[1-3]>/.test(trimmed) || /^<img/.test(trimmed)) return trimmed;
        return '<p>' + trimmed.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');

    return html;
}

async function load() {
    if (!slug) {
        document.getElementById('postTitle').textContent = 'Post not found';
        return;
    }
    const res = await fetch('/api/posts/' + encodeURIComponent(slug));
    if (!res.ok) {
        document.getElementById('postTitle').textContent = 'Post not found';
        return;
    }
    const post = await res.json();
    document.getElementById('postTitle').textContent = post.title;
    document.getElementById('postPath').textContent = '~/blog/' + post.slug + '.md';
    const published = new Date(post.published_at).toLocaleDateString();
    const edited = post.updated_at ? ' - Edited ' + new Date(post.updated_at).toLocaleString() : '';
    document.getElementById('postDate').textContent = published + edited;
    document.getElementById('postContent').innerHTML = renderMarkdown(post.content);
}
load();
</script>
</body>
</html>
