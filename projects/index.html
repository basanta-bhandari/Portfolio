<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="/theme.js?v=2"></script>
    <script src="/site-settings.js" defer></script>
    <link rel="stylesheet" href="/projects/styles.css">
    <link rel="stylesheet" href="/navbar.css?v=1">
    <link rel="stylesheet" href="/theme-toggle.css?v=2">
<link rel="stylesheet" href="/ui.css?v=1">
</head>
<body>
    <div class="grid-background"></div>
    <nav class="topnav" aria-label="Main navigation">
        <a href="/" class="brand">HOME?<span class="dot">.</span></a>
        <div class="links">
            <a href="/">Home</a>
            <a href="/projects" aria-current="page">Projects</a>
            <a href="/stats">Stats</a>
            <a href="/tether">Tether</a>
            <a href="/blog">Blog</a>
            <a href="https://github.com/basanta-bhandari" target="_blank" rel="noopener noreferrer">GitHub</a>
            <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch theme"><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
        </div>
    </nav>
    <main class="container">
        <section class="section-block">
            <div class="section-header">
                <h1>Projects</h1>
                <p>All my projects in one place.</p>
            </div>
            <label class="search-label" for="projectSearch">Search projects</label>
            <input id="projectSearch" class="search-input" type="search" placeholder="Name, description, category" autocomplete="off" disabled>
            <p class="project-freshness"><strong>Hey, this might be stale.</strong> I might have forgotten to update it. <span id="projectUpdated"></span> Check my <a href="https://github.com/basanta-bhandari" target="_blank" rel="noopener noreferrer">GitHub</a> for newer work.</p>
            <p id="projectStatus" role="status" aria-live="polite">Loading projects...</p>
            <button id="retryProjects" type="button" class="retry-button" hidden>Try again</button>
            <p id="searchEmpty" class="search-empty" hidden>No projects match that search.</p>
            <div id="contentGrid" class="content-grid" aria-busy="true"></div>
            <noscript><p>Enable JavaScript to load projects, or <a href="https://github.com/basanta-bhandari">view my work on GitHub</a>.</p></noscript>
        </section>
    </main>
    <footer><p>BASANTA BHANDARI - PORTFOLIO - 2026</p><p><a href="https://github.com/basanta-bhandari" target="_blank" rel="noopener">GitHub</a></p></footer>
    <script>
    const grid = document.getElementById('contentGrid');
    const search = document.getElementById('projectSearch');
    const empty = document.getElementById('searchEmpty');
    const status = document.getElementById('projectStatus');
    const retry = document.getElementById('retryProjects');
    let projectCount = 0;
    function fuzzyMatch(query, value) {
        const words = value.toLowerCase().match(/[\p{L}\p{N}]+/gu) || [];
        return query.toLowerCase().trim().split(/\s+/).every(term => words.some(word => {
            let at = 0;
            for (const character of term) { at = word.indexOf(character, at); if (at === -1) return false; at++; }
            return true;
        }));
    }
    function filterProjects() {
        const query = search.value.trim(); let visible = 0;
        grid.querySelectorAll('.project-card').forEach(card => { const matches = !query || fuzzyMatch(query, card.textContent); card.hidden = !matches; if (matches) visible++; });
        empty.hidden = projectCount === 0 || visible !== 0;
    }
    function asArray(value) { try { return Array.isArray(value) ? value : JSON.parse(value || '[]'); } catch { return []; } }
    function safeUrl(value) { try { const url = new URL(value); return /^https?:$/.test(url.protocol) && !url.username && !url.password ? url.href : null; } catch { return null; } }
    function text(parent, tag, value, className) { const el = document.createElement(tag); el.textContent = value; if (className) el.className = className; parent.appendChild(el); return el; }
    function addProject(project) {
        const card = document.createElement('article'); card.className = 'project-card'; card.id = 'project-' + project.id; text(card, 'h3', project.name); text(card, 'p', project.subtitle);
        const tags = document.createElement('div'); tags.className = 'tech-tags'; asArray(project.categories).forEach(category => text(tags, 'span', category, 'tech-tag')); card.appendChild(tags);
        const links = document.createElement('div'); links.className = 'project-links';
        const addLink = (url, label) => { const valid = safeUrl(url); if (!valid) return; const link = document.createElement('a'); link.href = valid; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = label; links.appendChild(link); };
        addLink(project.github_url, 'GitHub'); asArray(project.additional_links).forEach((link, index) => {
            if (typeof link === 'string') addLink(link, `Link ${index + 1}`);
            else addLink(link?.url, link?.label || `Link ${index + 1}`);
        });
        if (links.childElementCount) card.appendChild(links); grid.appendChild(card);
    }
    search.addEventListener('input', filterProjects);
    async function loadProjects() {
        search.disabled = true; retry.hidden = true; status.hidden = false;
        status.textContent = 'Loading projects...'; grid.setAttribute('aria-busy', 'true');
        try {
            const res = await fetch('/api/projects', { cache: 'no-store', signal: AbortSignal.timeout(15000) });
            if (!res.ok) throw new Error('Could not load projects');
            const projects = await res.json();
            if (!Array.isArray(projects)) throw new Error('Invalid project response');
            grid.replaceChildren(); projectCount = projects.length;
            projects.forEach(addProject);
            const dates = projects.map(project => Date.parse(project.updated_at || project.created_at)).filter(Number.isFinite);
            const updated = document.getElementById('projectUpdated'); updated.replaceChildren();
            if (dates.length) {
                const date = new Date(Math.max(...dates)), time = document.createElement('time');
                time.dateTime = date.toISOString(); time.textContent = date.toLocaleDateString(undefined, { dateStyle: 'long' });
                updated.append('Last updated: ', time, '.');
            }
            search.disabled = !projectCount;
            status.hidden = projectCount > 0; status.textContent = projectCount ? '' : 'No projects yet.';
            filterProjects();
            if (/^#project-\d+$/.test(location.hash)) document.getElementById(location.hash.slice(1))?.scrollIntoView({ block: 'center' });
        } catch {
            status.textContent = 'Could not load projects. Please try again.'; retry.hidden = false;
        } finally { grid.setAttribute('aria-busy', 'false'); }
    }
    retry.addEventListener('click', loadProjects);
    loadProjects();
    </script>
</body>
</html>
