<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Little Room</title>
<style>
  :root{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#322f39;background:#e9e4dc}
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
  main{width:min(100%,1320px)} .top{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 14px}
  h1{font-size:clamp(23px,3vw,36px);letter-spacing:-.045em;margin:0 0 3px} p{margin:0;color:#68616a;font-size:14px}
  .controls{display:flex;flex-wrap:wrap;gap:8px}.controls button,.download{font:inherit;font-size:13px;font-weight:700;border:1px solid #bbb1a8;background:#fffaf2;color:#39333c;border-radius:999px;padding:9px 14px;cursor:pointer}
  .controls button[aria-pressed=true]{background:#393847;color:white;border-color:#393847}button:focus-visible,.download:focus-visible{outline:3px solid #f0ab69;outline-offset:2px}
  .stage{background:#f6f1e8;border-radius:26px;overflow:hidden;box-shadow:0 20px 65px #57463618,inset 0 0 0 1px #fff8;position:relative}
  #room{display:block;width:100%;height:auto;aspect-ratio:1200/850}.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:14px 2px 0;flex-wrap:wrap}
  .foot p{font-size:13px}.download{padding:8px 13px;background:transparent}.object{cursor:pointer;transition:filter .18s}.object:hover,.object:focus-visible{filter:brightness(1.12) drop-shadow(0 0 5px #fff8);outline:none}.object:focus-visible .hit-outline{stroke:#ffb65c;stroke-width:4;opacity:1}
  @media(max-width:760px){body{padding:12px}.top{display:block}.controls{margin-top:16px}.stage{border-radius:16px}.foot{align-items:flex-start}}
  body{min-height:0;padding:0;display:block;background:transparent}main{width:100%}.top,.foot{display:none}.stage{border-radius:0;box-shadow:none;background:transparent}
</style>
</head>
<body>
<main>
  <div class="top"><div><h1>Little Room</h1><p>An isometric room through four kinds of light</p></div><div class="controls" role="group" aria-label="Choose a lighting preset">
    <button type="button" data-theme="morning" aria-pressed="true">Morning</button><button type="button" data-theme="rain" aria-pressed="false">Rain</button><button type="button" data-theme="sunset" aria-pressed="false">Sunset</button><button type="button" data-theme="night" aria-pressed="false">Night</button>
  </div></div>
  <div class="stage"><svg id="room" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="room-title room-desc"></svg></div>
  <div class="foot"><p id="status" role="status">Morning light across the floor. Select an object to inspect it.</p><button class="download" id="download" type="button">Download current SVG</button></div>
</main>
<script>
/* Little Room. Dependency-free SVG component. Coordinates are floor-grid x,y,z.
   Public API: window.LittleRoom.render(theme), .onObjectActivate = (id, element) => {},
   .setAvatar({x,y,markup}) / .clearAvatar(), .getSVG(). Valid themes: morning, rain, sunset, night.
   The avatar markup is a trusted SVG fragment supplied by your own app, at local origin (0,0);
   it is translated to a floor position. Never pass untrusted user text as markup. */
(() => {
  const svg = document.getElementById('room');
  const palettes = {
    morning:{sky0:'#a8d8df',sky1:'#fce0ac',far:'#85aaa3',light:'#fff1b5',beam:.31,ambient:'#ffddae',veil:.08,screen:'#547383',bulb:false,cloud:.05},
    rain:{sky0:'#8299ab',sky1:'#c8d2d0',far:'#8199a1',light:'#dce8e8',beam:.13,ambient:'#97abc0',veil:.20,screen:'#769db1',bulb:false,cloud:.72},
    sunset:{sky0:'#b96470',sky1:'#f3a06b',far:'#a57479',light:'#ffb465',beam:.38,ambient:'#e98573',veil:.15,screen:'#746582',bulb:false,cloud:.24},
    night:{sky0:'#192b4e',sky1:'#46547d',far:'#344461',light:'#94a9dc',beam:.13,ambient:'#344267',veil:.42,screen:'#8ab9cd',bulb:true,cloud:.12}
  };
  const names={bed:'Bed',wardrobe:'Wardrobe',computerDesk:'Computer desk',desktop:'Desktop computer',macbook:'MacBook',miniPc:'Mini PC',plant:'Plastic plant',stove:'Kitchen stove',mokaPot:'Moka pot',bookTable:'Book table',books:'Books',penholder:'Penholder',notes:'Sticky notes',carpet:'Carpet',bulb:'Bulb',computerChair:'Computer chair',bookChair:'Reading chair',door:'Door',window:'Window'};
  let theme='morning', avatar=null;
  const P=(x,y,z=0)=>[600+(x-y)*47,280+(x+y)*24-z*43];
  const S=(pts)=>pts.map(p=>p.map(n=>Math.round(n*10)/10).join(',')).join(' ');
  const Q=(pts)=>S(pts.map(p=>P(...p)));
  const polygon=(pts,fill,stroke='#665965',width=2,extra='')=>`<polygon points="${Q(pts)}" fill="${fill}" stroke="${stroke}" stroke-width="${width}" stroke-linejoin="round" ${extra}/>`;
  const line=(a,b,color='#786a72',width=2,extra='')=>{const [x1,y1]=P(...a),[x2,y2]=P(...b);return `<path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linecap="round" ${extra}/>`};
  const ellipse=(x,y,z,rx,ry,fill,extra='')=>{const [cx,cy]=P(x,y,z);return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" ${extra}/>`};
  const box=(x,y,w,d,h,top,front,right,z=0,stroke='#685d67')=>{
    const a=[x,y,z],b=[x+w,y,z],c=[x+w,y+d,z],e=[x,y+d,z],at=[x,y,z+h],bt=[x+w,y,z+h],ct=[x+w,y+d,z+h],et=[x,y+d,z+h];
    return polygon([e,c,ct,et],front,stroke)+polygon([b,c,ct,bt],right,stroke)+polygon([at,bt,ct,et],top,stroke);
  };
  const group=(id,body)=>`<g class="object" data-object="${id}" role="button" tabindex="0" aria-label="${names[id]}"><title>${names[id]}</title>${body}</g>`;
  const floorShadow=(x,y,rx,ry,alpha=.14)=>ellipse(x,y,0,rx,ry,'#302b3c',`opacity="${alpha}"`);
  const book=(x,y,w,d,z,color)=>box(x,y,w,d,.12,color,'#e9d9b7',color,z,'#655967');
  function backdrop(t){
    const c=palettes[t];let grain='';for(let i=0;i<28;i++){const x=80+(i*193)%1050,y=102+(i*137)%645;grain+=`<circle cx="${x}" cy="${y}" r="${i%3===0?1.3:.75}" fill="#5d4f62" opacity=".085"/>`}
    return `<defs>
      <radialGradient id="bulbGlow"><stop stop-color="#ffe6aa" stop-opacity=".55"/><stop offset="1" stop-color="#ffe6aa" stop-opacity="0"/></radialGradient>
      <clipPath id="windowClip"><polygon points="${Q([[4.1,0,3.75],[9.3,0,3.75],[9.3,0,1.56],[4.1,0,1.56]])}"/></clipPath>
      <clipPath id="floorClip"><polygon points="${Q([[0,0],[10,0],[10,10],[0,10]])}"/></clipPath>
      <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>
    <rect width="1200" height="850" fill="${t==='night'?'#42455f':t==='rain'?'#d0d9dc':t==='sunset'?'#f1d1be':'#f3e9dc'}"/>
    <ellipse cx="600" cy="774" rx="460" ry="42" fill="#4a394d" opacity=".15" filter="url(#soft)"/>
    ${polygon([[0,0,4.4],[0,10,4.4],[0,10,0],[0,0,0]],t==='night'?'#b7b3bd':'#e1e9e2','#a99da0',3)}
    ${polygon([[0,0,4.4],[10,0,4.4],[10,0,0],[0,0,0]],t==='night'?'#abaebc':t==='sunset'?'#e4c8bd':'#cbdedb','#a99da0',3)}
    ${polygon([[0,0],[10,0],[10,10],[0,10]],t==='night'?'#816979':t==='rain'?'#c7a38d':'#d2a27d','#806d70',3)}
    <g clip-path="url(#floorClip)" opacity=".21">${Array.from({length:10},(_,i)=>line([0,i+1,.015],[10,i+1,.015],'#9b6e61',1.4)).join('')}${Array.from({length:7},(_,i)=>line([i*1.7,0,.015],[i*1.7,10,.015],'#b88a70',1)).join('')}</g>
    ${line([0,0,.04],[0,10,.04],'#a97e76',5)}${line([0,0,.04],[10,0,.04],'#9a8c84',5)}
    <g pointer-events="none">${grain}</g>`;
  }
  function windowArt(t){
    const c=palettes[t];let sky=polygon([[4.1,0,3.75],[9.3,0,3.75],[9.3,0,1.56],[4.1,0,1.56]],c.sky0,'none',0);
    sky+=polygon([[4.1,0,2.35],[9.3,0,2.35],[9.3,0,1.56],[4.1,0,1.56]],c.sky1,'none',0,`opacity=".74"`);
    sky+=polygon([[4.1,0,1.56],[5.7,0,2.03],[7.0,0,1.85],[8.1,0,2.19],[9.3,0,1.79],[9.3,0,1.56]],c.far,'none',0,`opacity=".43"`);
    if(t==='morning'||t==='sunset'){const [sx,sy]=P(t==='sunset'?8.1:6.5,0,t==='sunset'?2.37:2.8);sky+=`<circle cx="${sx}" cy="${sy}" r="${t==='sunset'?21:18}" fill="${c.light}" opacity=".9"/>`}
    if(t==='night'){const [mx,my]=P(7.6,0,3.08);sky+=`<circle cx="${mx}" cy="${my}" r="16" fill="#e7e2ce"/>`;for(let i=0;i<11;i++){const [sx,sy]=P(4.4+i*.42,0,3.3-(i%3)*.16);sky+=`<circle cx="${sx}" cy="${sy}" r="1.25" fill="#faf2d7" opacity=".8"/>`}}
    if(t==='rain'){for(let i=0;i<24;i++){const [rx,ry]=P(4.42+(i*11%47)/10,0,3.4-(i*7%14)/10);sky+=`<path d="M${rx} ${ry}l-3 9" stroke="#e5eced" opacity=".6" stroke-width="1.5"/>`}}
    if(c.cloud){sky+=`<path d="M847 278 Q867 265 881 276 Q901 265 918 285 M925 317 Q945 307 961 320" fill="none" stroke="#f0eff0" opacity="${c.cloud}" stroke-width="8" stroke-linecap="round"/>`}
    let frame=polygon([[4.1,0,3.75],[9.3,0,3.75],[9.3,0,1.56],[4.1,0,1.56]],'none','#4e5361',10);
    for(let i=1;i<6;i++)frame+=line([4.1+i*5.2/6,0,3.75],[4.1+i*5.2/6,0,1.56],'#434651',3);
    for(let i=1;i<4;i++)frame+=line([4.1,0,3.75-i*2.19/4],[9.3,0,3.75-i*2.19/4],'#434651',3);
    frame+=line([4.05,-.03,1.49],[9.35,-.03,1.49],'#d4c9b8',7);
    return group('window',sky+frame);
  }
  function illumination(t){
    const c=palettes[t];let beams=`<g clip-path="url(#floorClip)" pointer-events="none">`;
    beams+=polygon([[4.1,0,.025],[9.3,0,.025],[8.1,6.95,.025],[2.4,6.15,.025]],c.light,'none',0,`opacity="${c.beam*.48}"`);
    for(let i=1;i<6;i++)beams+=line([4.1+i*5.2/6,.05,.04],[2.4+i*5.7/6,6.2+.75*i/6,.04],c.light,t==='rain'?2:3,`opacity="${c.beam*.63}"`);
    beams+='</g>';
    return beams;
  }
  function door(){
    let b=polygon([[0,7.62,3.22],[0,9.35,3.22],[0,9.35,0],[0,7.62,0]],'#976f71','#665c65',6);
    b+=polygon([[0,7.78,3.08],[0,9.2,3.08],[0,9.2,.05],[0,7.78,.05]],'#bd8d84','#6b5964',2);
    b+=line([0,7.88,2.05],[0,9.12,2.05],'#916c6e',2)+line([0,7.88,.95],[0,9.12,.95],'#916c6e',2);
    b+=ellipse(0,8.91,1.48,3.2,3.2,'#f4d4a8');return group('door',b);
  }
  function notes(){
    let b='';const colors=['#f6d69a','#efd2ce','#d2dabb','#ecdcbc','#e5c5b5','#d9d4a8','#f5d5ad','#c9d7d0'];
    for(let i=0;i<8;i++){let y=3.32+(i%4)*.56,z=2.65+Math.floor(i/4)*.59;
      b+=polygon([[0,y,z+.43],[0,y+.44,z+.43],[0,y+.44,z],[0,y,z]],colors[i],'#c7b6a8',1.2);
      b+=line([0,y+.09,z+.28],[0,y+.32,z+.28],'#988f90',1,`opacity=".65"`);
    }return group('notes',b);
  }
  function wardrobe(){
    const x=.25,y=.62,w=1.66,d=2.08,h=2.86,front=y+d+.015;
    let b=floorShadow(1.2,1.9,72,17)+box(x,y,w,d,h,'#d86c74','#b8495b','#a94353',0,'#713c4c');
    b+=polygon([[x+.08,front,.12],[x+.81,front,.12],[x+.81,front,h-.1],[x+.08,front,h-.1]],'#c65464','#843f50',1.5);
    b+=polygon([[x+.85,front,.12],[x+w-.08,front,.12],[x+w-.08,front,h-.1],[x+.85,front,h-.1]],'#bc485a','#843f50',1.5);
    b+=polygon([[x+.16,front+.008,.51],[x+.73,front+.008,.51],[x+.73,front,h-.28],[x+.16,front,h-.28]],'#dbd9d0','#936c70',2);
    b+=line([x+.22,front+.02,h-.47],[x+.46,front+.02,h-.47],'#f8eee1',2,`opacity=".75"`);
    b+=line([x+.7,front+.03,1.54],[x+.7,front+.03,1.32],'#f5d5b2',3.4);
    b+=line([x+.95,front+.03,1.54],[x+.95,front+.03,1.32],'#f5d5b2',3.4);
    b+=line([x+.06,front,.11],[x+w-.06,front,.11],'#7f4250',2);
    return group('wardrobe',b);
  }
  function stove(){
    let b=floorShadow(3.1,1.35,77,19)+box(2.25,.55,1.7,1.35,.96,'#e6ded4','#c7c3bd','#d2cac2');
    b+=box(2.28,.56,1.64,1.28,.12,'#59626a','#747980','#424a57',.96,'#454b56');
    b+=ellipse(2.76,1.03,1.1,15,7,'#303a43')+ellipse(3.45,1.32,1.1,15,7,'#303a43');
    b+=ellipse(2.65,1.46,.72,3.7,3.7,'#776f69')+ellipse(3.07,1.68,.72,3.7,3.7,'#776f69');return group('stove',b);
  }
  function moka(){
    const [cx,cy]=P(2.85,1.03,1.14);
    let b=`<ellipse cx="${cx}" cy="${cy+1}" rx="19" ry="7" fill="#303943" opacity=".38"/>`;
    b+=`<path d="M${cx-16} ${cy-3} L${cx-13} ${cy-23} L${cx+12} ${cy-23} L${cx+17} ${cy-3} Q${cx} ${cy+4} ${cx-16} ${cy-3}Z" fill="#c8ccc6" stroke="#4c5660" stroke-width="2.4" stroke-linejoin="round"/>`;
    b+=`<path d="M${cx-13} ${cy-23} L${cx-17} ${cy-31} L${cx-8} ${cy-40} L${cx+8} ${cy-40} L${cx+16} ${cy-31} L${cx+12} ${cy-23}Z" fill="#e4e2d7" stroke="#4c5660" stroke-width="2.4" stroke-linejoin="round"/>`;
    b+=`<path d="M${cx-13} ${cy-23}H${cx+12} M${cx-9} ${cy-15}L${cx-7} ${cy-5}" fill="none" stroke="#68717a" stroke-width="2"/>`;
    b+=`<path d="M${cx+15} ${cy-28}H${cx+28}V${cy-12}H${cx+17}" fill="none" stroke="#3c414a" stroke-width="5" stroke-linejoin="round"/>`;
    b+=`<path d="M${cx-17} ${cy-30}l-9 -4 9 -3" fill="#c5c8c4" stroke="#4c5660" stroke-width="2" stroke-linejoin="round"/>`;
    b+=`<path d="M${cx-10} ${cy-42}Q${cx} ${cy-46} ${cx+10} ${cy-42}" fill="none" stroke="#4c5660" stroke-width="2.5"/><circle cx="${cx}" cy="${cy-47}" r="3.5" fill="#454a51"/>`;
    return group('mokaPot',b);
  }
  function table(x,y,w,d,top='#756273'){
    let b=floorShadow(x+w/2,y+d/2,94,20);
    for(const [lx,ly] of [[x+.13,y+.12],[x+w-.16,y+.12],[x+w-.16,y+d-.15],[x+.13,y+d-.15]])b+=box(lx,ly,.13,.13,.88,'#876f72','#695762','#604e5d',0,'#655766');
    b+=box(x,y,w,d,.13,top,'#594c59','#66545e',.89);return b;
  }
  function computerDesk(){return group('computerDesk',table(5.05,.52,4.12,1.65,'#756875'))}
  function desktop(t){
    let b=polygon([[5.42,.73,1.13],[6.55,.73,1.13],[6.55,.73,2.03],[5.42,.73,2.03]],'#39414e','#414551',3);
    b+=polygon([[5.51,.72,1.25],[6.46,.72,1.25],[6.46,.72,1.91],[5.51,.72,1.91]],palettes[t].screen,'#202d3b',1);
    b+=line([5.72,.715,1.73],[6.21,.715,1.73],'#a6c9cd',2,`opacity=".75"`)+line([5.72,.715,1.57],[6.34,.715,1.57],'#a6c9cd',2,`opacity=".55"`);
    b+=line([5.98,.75,1.13],[5.98,.75,1.04],'#4d4c56',4)+box(5.62,1.52,.77,.29,.035,'#c1c3c6','#7a8187','#8b9193',1.04,'#61656d');return group('desktop',b);
  }
  function macbook(t){
    let b=polygon([[6.74,.78,1.13],[7.65,.78,1.13],[7.65,.78,1.84],[6.74,.78,1.84]],'#3a4552','#525663',2.5);
    b+=polygon([[6.81,.77,1.2],[7.58,.77,1.2],[7.58,.77,1.77],[6.81,.77,1.77]],palettes[t].screen,'none',0);
    b+=polygon([[6.71,.78,1.13],[7.67,.78,1.13],[7.75,1.56,1.05],[6.64,1.56,1.05]],'#d4d4ce','#777b84',2);
    b+=line([6.87,1.3,1.07],[7.53,1.3,1.07],'#9b9fa1',1.5);return group('macbook',b);
  }
  function miniPc(){
    const x=8.06,y=.73,w=.64,d=.47,z=1.05,h=.37;
    let b=box(x,y,w,d,h,'#545a66','#363e4d','#434958',z,'#303945');
    b+=line([x+.12,y+d+.016,z+.14],[x+.26,y+d+.016,z+.14],'#a5b1b6',2);
    b+=line([x+.34,y+d+.016,z+.14],[x+.47,y+d+.016,z+.14],'#a5b1b6',2);
    b+=ellipse(x+.55,y+d+.018,z+.16,2.5,2.5,'#9fd1b8');
    return group('miniPc',b);
  }
  function plant(){
    let b=box(8.56,1.66,.34,.34,.26,'#ebddd4','#bcb7b0','#c9c4b8',1.05,'#8c827e');
    for(const [a,d] of [[-.26,.22],[.22,.19],[-.17,.33],[.16,.35]])b+=line([8.72,1.82,1.31],[8.72+a,1.82+d,1.72],'#5d837a',4);
    return group('plant',b);
  }
  function chair(x,y,id,color){
    let b=floorShadow(x+.46,y+.44,38,12,.17);
    for(const [lx,ly] of [[x+.13,y+.12],[x+.78,y+.12],[x+.78,y+.75],[x+.13,y+.75]])b+=line([lx,ly,0],[lx,ly,.51],'#685963',4);
    b+=box(x,y,.92,.87,.12,color,'#7e6570','#685967',.49);
    b+=polygon([[x,y+.87,.55],[x+.91,y+.87,.55],[x+.91,y+.87,1.47],[x,y+.87,1.47]],color,'#685967',3);return group(id,b);
  }
  function bookTable(){return group('bookTable',table(.55,3.58,2.65,1.34,'#b79d8d'))}
  function books(){let b='';const bs=[['#768c98',.72,3.75,1.05],['#c16b69',.78,3.83,1.2],['#e5be79',.85,3.9,1.33],['#6d807b',1.76,3.75,1.05],['#d6a080',1.83,3.82,1.18],['#8581a1',2.14,4.31,1.05]];
    for(const [c,x,y,z] of bs)b+=book(x,y,.64,.37,z,c);return group('books',b);
  }
  function penholder(){let b=box(2.74,3.78,.25,.24,.3,'#b65e67','#914956','#9f5460',1.05);
    b+=line([2.82,3.84,1.35],[2.8,3.82,1.64],'#4b6379',2)+line([2.88,3.85,1.35],[2.95,3.8,1.59],'#dbad73',2);return group('penholder',b)}
  function bed(){
    const x=7.5,y=6.55,w=2.32,d=3.05;
    let b=floorShadow(8.66,8.08,94,28,.15)+box(x,y,w,d,.34,'#a8847e','#876c70','#765e66',.1);
    b+=box(x+.09,y+.09,w-.18,d-.18,.22,'#e5e0d6','#d4cfc5','#c2c2bf',.45);
    b+=box(x-.09,y-.035,w+.18,.14,.83,'#a97c77','#805f68','#8b6970',.08);
    b+=polygon([[x+.13,y+1.01,.69],[x+w-.13,y+1.01,.69],[x+w-.13,y+d-.12,.69],[x+.13,y+d-.12,.69]],'#587f94','#395b72',2.5);
    b+=line([x+.18,y+1.08,.71],[x+w-.18,y+1.08,.71],'#a2c1bf',2.3);
    b+=box(x+.2,y+.24,.85,.65,.11,'#f0e7db','#d5d5d0','#c8c7c2',.69,'#aaaeb0');
    b+=box(x+1.22,y+.24,.85,.65,.11,'#eee9df','#d5d8d4','#c6c8c6',.69,'#aaaeb0');
    return group('bed',b);
  }
  function carpet(){
    let b=polygon([[3.43,4.3,.025],[7.58,4.3,.025],[7.58,7.48,.025],[3.43,7.48,.025]],'#9e8290','#846f80',3);
    b+=polygon([[3.65,4.54,.03],[7.36,4.54,.03],[7.36,7.25,.03],[3.65,7.25,.03]],'none','#d9b9ad',2);
    b+=line([4.05,5.05,.04],[6.96,6.73,.04],'#dec2b3',1.5,`opacity=".45"`);return group('carpet',b);
  }
  function bulb(t){let b='';if(palettes[t].bulb)b+='<ellipse cx="600" cy="197" rx="59" ry="49" fill="#ffe6aa" opacity=".13" pointer-events="none"/>';
    b+=line([0,0,4.43],[0,0,3.21],'#6f686f',2)+ellipse(0,0,3.2,12,7,'#6e6670')+ellipse(0,0,3.03,9,12,palettes[t].bulb?'#ffe3ab':'#f3e6d2',`stroke="#837b7e" stroke-width="2"`);
    return group('bulb',b);
  }
  function actionAreas(){
    const area=(id,x,y,z,rx,ry)=>group(id,ellipse(x,y,z,rx,ry,'transparent','pointer-events="all"'));
    return area('wardrobe',1.1,1.72,1.35,70,82)+area('mokaPot',2.85,1.03,1.32,34,34)+area('bookTable',1.88,4.24,1.04,96,43)+area('macbook',7.2,1.14,1.36,58,38)+area('miniPc',8.38,.97,1.28,47,34)+area('bed',8.65,8.04,.55,96,58);
  }
  function scene(t){
    const c=palettes[t];return `${backdrop(t)}${illumination(t)}${windowArt(t)}${door()}${notes()}${wardrobe()}${stove()}${moka()}${carpet()}${bed()}${bookTable()}${books()}${penholder()}${computerDesk()}${desktop(t)}${macbook(t)}${miniPc()}${plant()}${chair(6.86,2.36,'computerChair','#b97c79')}${chair(3.22,5.08,'bookChair','#698c86')}${bulb(t)}${actionAreas()}<g id="avatar-layer"></g><rect width="1200" height="850" fill="${c.ambient}" opacity="${c.veil}" pointer-events="none"/>`;
  }
  function mountAvatar(){const layer=svg.querySelector('#avatar-layer');if(!avatar)return;const [x,y]=P(avatar.x,avatar.y,0);layer.innerHTML=`<g transform="translate(${x} ${y})">${avatar.markup}</g>`}
  const api={onObjectActivate:null,render(next='morning'){
    if(!palettes[next])throw new Error(`Unknown room theme: ${next}`);theme=next;
    svg.innerHTML=`<title id="room-title">Little Room, ${next}</title><desc id="room-desc">An isometric room with a gridded window, bed, red wardrobe, two desks, stove, rug and door in ${next} light.</desc>${scene(next)}`;
    mountAvatar();document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===next)));
    document.getElementById('status').textContent=({morning:'Morning light across the floor.',rain:'Soft grey daylight and rain at the window.',sunset:'Warm orange light stretches across the room.',night:'Blue night light and a glowing bulb.'})[next]+' Select an object to inspect it.';
    return svg;
  },setAvatar({x,y,markup}){if(!Number.isFinite(x)||!Number.isFinite(y)||x<0||x>10||y<0||y>10)throw new Error('Avatar floor coordinates must be between 0 and 10.');avatar={x,y,markup};mountAvatar()},clearAvatar(){avatar=null;svg.querySelector('#avatar-layer').innerHTML=''},getSVG(){const copy=svg.cloneNode(true);copy.removeAttribute('id');copy.setAttribute('width','1200');copy.setAttribute('height','850');return new XMLSerializer().serializeToString(copy)}};
  svg.addEventListener('click',e=>{const item=e.target.closest('[data-object]');if(item&&svg.contains(item))activate(item)});
  svg.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-object]')){e.preventDefault();activate(e.target)}});
  function activate(item){const id=item.dataset.object;document.getElementById('status').textContent=names[id]+' selected.';api.onObjectActivate?.(id,item)}
  document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>api.render(b.dataset.theme)));
  document.getElementById('download').addEventListener('click',()=>{const blob=new Blob([api.getSVG()],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`little-room-${theme}.svg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)});
  window.LittleRoom=api;api.render();
})();
</script>
