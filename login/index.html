<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="icon" type="image/png" href="/favicon.png">
<script src="/theme.js?v=2"></script>
<link rel="stylesheet" href="../blog/styles.css">
<link rel="stylesheet" href="/theme-toggle.css?v=2">
<style>
  .login-shell {
    max-width: 1100px;
    margin: 0 auto;
    padding: 80px 40px;
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
  }
  .login-box {
    width: 100%;
    max-width: 380px;
    border: 2px solid var(--line);
    border-radius: calc(var(--radius) + 2px);
    padding: 36px;
    background: var(--bg);
    box-shadow: 0 14px 30px rgba(0,0,0,.08);
  }
  .login-box h1 {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.6rem;
    margin-bottom: 6px;
  }
  .login-box .sub {
    color: var(--muted);
    font-size: .82rem;
    margin-bottom: 26px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: .72rem;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 11px 12px;
    font-family: var(--mono);
    font-size: .9rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--fg);
  }
  .field input:focus {
    outline: none;
    border-color: var(--fg);
  }
  .login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: .88rem;
    letter-spacing: .5px;
    background: var(--fg);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .login-box button:hover { opacity: .85; }
  .error {
    color: #c0392b;
    font-size: .8rem;
    margin-bottom: 14px;
    min-height: 1em;
  }
  @media (max-width: 620px) {
    .login-shell { padding: 42px 18px; }
    .login-box { padding: 26px 20px; }
    .field input { font-size: 16px; }
  }
  @media (max-width: 560px) {
    .login-shell { padding: 30px 16px 40px; }
    .login-box { border-width: 1px; border-radius: 20px; padding: 24px 18px; }
    .login-box .sub { margin-bottom: 20px; }
  }
</style>
</head>
<body>
<div class="grid-background"></div>

<nav class="topnav">
    <a href="../index.html" class="brand">Home?<span class="dot">.</span></a>
    <div class="links">
        <a href="../index.html">Home</a>
        <a href="../projects/">Projects</a>
        <a href="../blog/index.html">Blog</a>
        <a href="https://github.com/basanta-bhandari" target="_blank">GitHub</a>
        <button type="button" class="theme-toggle" data-theme-toggle><svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg><svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg></button>
    </div>
</nav>

<div class="login-shell">
  <div class="login-box">
    <h1>Admin Login</h1>
    <p class="sub">Sign in to write a post.</p>
    <div class="error" id="errorMsg"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Log in</button>
    </form>
  </div>
</div>

<footer>
    <p>BASANTA BHANDARI - PORTFOLIO - 2026</p>
</footer>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errorMsg.textContent = data.error || 'Login failed';
      return;
    }
    window.location.href = '/admin/index.html';
  } catch {
    errorMsg.textContent = 'Network error';
  }
});
</script>
</body>
</html>
