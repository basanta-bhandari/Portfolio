<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="../blog/styles.css">
<style>
  .login-shell {
    max-width: 1100px;
    margin: 0 auto;
    padding: 80px 40px;
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
  }
  .login-box {
    width: 100%;
    max-width: 380px;
    border: 2px solid var(--line);
    border-radius: calc(var(--radius) + 2px);
    padding: 36px;
    background: var(--bg);
    box-shadow: 0 14px 30px rgba(0,0,0,.08);
  }
  .login-box h1 {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.6rem;
    margin-bottom: 6px;
  }
  .login-box .sub {
    color: var(--muted);
    font-size: .82rem;
    margin-bottom: 26px;
  }
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: .72rem;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 11px 12px;
    font-family: var(--mono);
    font-size: .9rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
    color: var(--fg);
  }
  .field input:focus {
    outline: none;
    border-color: var(--fg);
  }
  .login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    font-family: var(--mono);
    font-size: .88rem;
    letter-spacing: .5px;
    background: var(--fg);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity .15s;
  }
  .login-box button:hover { opacity: .85; }
  .error {
    color: #c0392b;
    font-size: .8rem;
    margin-bottom: 14px;
    min-height: 1em;
  }
</style>
</head>
<body>
<div class="grid-background"></div>

<nav class="topnav">
    <a href="../index.html" class="brand">Home?<span class="dot">.</span></a>
    <div class="links">
        <a href="../index.html">Home</a>
        <a href="../projects/">Projects</a>
        <a href="../blog/index.html">Blog</a>
        <a href="https://github.com/basanta-bhandari" target="_blank">GitHub</a>
    </div>
</nav>

<div class="login-shell">
  <div class="login-box">
    <h1>Admin Login</h1>
    <p class="sub">Sign in to write a post.</p>
    <div class="error" id="errorMsg"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Log in</button>
    </form>
  </div>
</div>

<footer>
    <p>BASANTA BHANDARI &bull; PORTFOLIO &bull; 2026</p>
</footer>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      errorMsg.textContent = data.error || 'Login failed';
      return;
    }
    window.location.href = '/admin/index.html';
  } catch {
    errorMsg.textContent = 'Network error';
  }
});
</script>
</body>
</html>
